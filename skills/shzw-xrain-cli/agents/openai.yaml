interface:
  display_name: "XRain CLI"
  short_description: "Use XRain and Workforce data, messages, tasks, mail and agents"
  default_prompt: "使用 $shzw-xrain-cli，沿已确定的系统与主体选择现有能力，按需读取命中专题和命令帮助；不确定能力归属时再查任务选择。直接运行随附脚本，需要短命令时再注册。业务请求前按相同目标与凭据核对身份，未变化时复用；只执行获准动作并核对回执，未知结果先查原提交，缺工具或权限时说明限制。"
policy:
  allow_implicit_invocation: true
