interface:
  display_name: "XRain CLI"
  short_description: "Manage XRain platform accounts, data and applications"
  default_prompt: "使用 $shzw-xrain-cli，从任务和项目配置确定目标，用 whoami 核对服务器身份与租户后复用有效连接；目标或身份变化时重查，只有必要时恢复浏览器认证。账号准备遵循固定身份和当前授权，认证中心身份及客户端登记使用其自身管理入口，不输出凭据。"
policy:
  allow_implicit_invocation: true
