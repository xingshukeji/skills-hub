interface:
  display_name: "XRain CLI"
  short_description: "Manage XRain platform accounts, data and applications"
  default_prompt: "Use $xrain-cli to connect to the requested XRain platform, complete browser authentication, prepare platform users when needed, and perform the requested operation without exposing credentials. Use the authentication center's own management entry for its accounts and client registration."
policy:
  allow_implicit_invocation: true
